// Use this file to configure your LISTEN server. 
// This config file is executed everytime the server changes levels.


// If you run a listen server and choose to modify this file, 
// note that assigning values to the following variables within 
// this file will stomp the choices you make in the Launcher 
// server configuration "Advanced Options" screen:
//
// hostname
// maxplayers
// password
// mp_fraglimit
// mp_timelimit
// mp_falldamage
// mp_weaponstay
// mp_friendlyfire
// mp_forcerespawn
// mp_footsteps
// mp_flashlight
// mp_autocrosshair
// teamplay

sv_voicequality "5"
sv_voicecodec "voice_speex"

// player bounding boxes (collisions, not clipping)
sv_clienttrace 3.5

// disable clients' ability to pause the server
pausable 0

// maximum client movement speed 
sv_maxvelocity 5000

//max player speeds
sv_maxspeed 5000

//disable cheats
sv_cheats 	0
sv_lan 0


// MOVEMENT

sv_jumpheight "600"
sv_jumpheight_stamina_drain "5"
sv_d_jumpheight 425
sv_d_jumpheight_stamina_drain 10
sv_w_jumpheight 500

sv_dash_speed "400"
sv_dash_stamina_drain "3"
sv_dodge_speed "900"
sv_dodge_stamina_drain "120"
sv_backflip_speed "450"
sv_backflip_stamina_drain "15"


